name: "Open WebUI CFM"
version: "2026.09.03"
slug: "open_webui_cfm"
description: "Open WebUI for Home Assistant"
url: "https://github.com/carferrer/open-webui-cfm"
image: "ghcr.io/carferrer/open-webui-cfm"

arch:
  - amd64
  - aarch64

startup: application
boot: auto
init: false

webui: "http://[HOST]:[PORT:8080]"

ports:
  8080/tcp: 3000

ports_description:
  8080/tcp: "Open WebUI HTTP backend"

options:
  webui_auth: true
  ollama_base_url: ""
  webui_url: ""
  cors_allow_origin: ""

schema:
  webui_auth: bool
  ollama_base_url: str?
  webui_url: str?
  cors_allow_origin: str?

map:
  - type: data
    read_only: false
